<body class="internal">

        <div>
            <h1>
                Please enter the password.
            </h1>
            <form id="loginForm" novalidate>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <div style="position: relative; display: inline-flex; align-items: center;">
                        <input type="password" id="pass" name="password" required style="padding-right: 2rem;" />
                        <button type="button" id="togglePassword" aria-label="Show password" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: url('assets/eye.png') center/contain no-repeat; width: 18px; height: 18px; border: none; cursor: pointer; padding: 0; background-color: transparent;"></button>
                    </div>
                    <button type="submit" class="menu">Enter</button>
                </div>
                <p id="errorMsg" style="color: #b00020; margin-top: 0.75rem;"></p>
            </form>
        </div>
        <script>
            const passwordHash = 'd32145529adaa1b92e1b38e56e0632d6957dd20da55d640f800f13c9dfc9dc3d';
            const passwordSalt = 'wedding';
            const form = document.getElementById('loginForm');
            const input = document.getElementById('pass');
            const toggleButton = document.getElementById('togglePassword');
            const errorMsg = document.getElementById('errorMsg');

            function bytesToHex(bytes) {
                return Array.from(bytes)
                    .map(function (b) { return b.toString(16).padStart(2, '0'); })
                    .join('');
            }

            // Fallback for non-secure contexts (file://) where crypto.subtle is unavailable.
            function sha256HexSync(text) {
                function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
                function toWords(msg) {
                    var l = msg.length * 8;
                    var words = [];
                    for (var i = 0; i < msg.length; i++) {
                        words[i >> 2] |= msg.charCodeAt(i) << (24 - (i % 4) * 8);
                    }
                    words[l >> 5] |= 0x80 << (24 - l % 32);
                    words[(((l + 64) >> 9) << 4) + 15] = l;
                    return words;
                }
                var K = [
                    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
                    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
                    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
                    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
                    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
                    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
                    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
                    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
                ];
                var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
                // Encode as UTF-8 then process as binary string of byte values
                var utf8 = unescape(encodeURIComponent(text));
                var w = toWords(utf8);
                for (var i = 0; i < w.length; i += 16) {
                    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
                    var W = [];
                    for (var j = 0; j < 64; j++) {
                        if (j < 16) {
                            W[j] = w[i + j] | 0;
                        } else {
                            var s0 = rotr(7, W[j - 15]) ^ rotr(18, W[j - 15]) ^ (W[j - 15] >>> 3);
                            var s1 = rotr(17, W[j - 2]) ^ rotr(19, W[j - 2]) ^ (W[j - 2] >>> 10);
                            W[j] = (W[j - 16] + s0 + W[j - 7] + s1) | 0;
                        }
                        var S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
                        var ch = (e & f) ^ (~e & g);
                        var temp1 = (h + S1 + ch + K[j] + W[j]) | 0;
                        var S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
                        var maj = (a & b) ^ (a & c) ^ (b & c);
                        var temp2 = (S0 + maj) | 0;
                        h = g; g = f; f = e; e = (d + temp1) | 0;
                        d = c; c = b; b = a; a = (temp1 + temp2) | 0;
                    }
                    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
                    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
                }
                var out = '';
                for (var k = 0; k < H.length; k++) {
                    out += ('00000000' + (H[k] >>> 0).toString(16)).slice(-8);
                }
                return out;
            }

            async function sha256Hex(text) {
                if (window.crypto && crypto.subtle) {
                    var data = new TextEncoder().encode(text);
                    var digest = await crypto.subtle.digest('SHA-256', data);
                    return bytesToHex(new Uint8Array(digest));
                }
                return sha256HexSync(text);
            }

            toggleButton.addEventListener('click', function () {
                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                toggleButton.style.backgroundImage = isPassword ? 'url("assets/visible.png")' : 'url("assets/eye.png")';
            });

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                errorMsg.textContent = '';

                try {
                    var enteredPassword = input.value.trim();
                    var enteredHash = await sha256Hex(enteredPassword + passwordSalt);

                    if (enteredHash === passwordHash) {
                        localStorage.setItem('weddingAccess', 'true');
                        window.location.href = 'home.html';
                    } else {
                        errorMsg.textContent = 'That password is incorrect. Please try again.';
                        input.value = '';
                        input.focus();
                    }
                } catch (err) {
                    errorMsg.textContent = 'Login could not verify the password. Please try again.';
                }
            });
        </script>
